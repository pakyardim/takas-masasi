<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; padding: 14px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #16181d; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .muted { color: #6b7280; font-size: 12px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 12px; color: #374151; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
    button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 8px; background: #5b4bdb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #eef2ff; color: #3730a3; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #f4f5f7; min-height: 18px; white-space: pre-wrap; }
    #status.err { background: #fee2e2; color: #b91c1c; }
    #status.ok { background: #dcfce7; color: #15803d; }
    .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  </style>
</head>
<body>
  <h1>Takas Masası</h1>
  <div class="muted" id="league">Yahoo Fantasy lig sayfasında aç.</div>

  <div class="row">
    <div><label for="lid">Lig ID</label><input id="lid" placeholder="56909"></div>
    <div><label for="server">Uygulama adresi</label><input id="server" value="http://127.0.0.1:8000"></div>
  </div>

  <label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" id="force" style="width:auto"> Her şeyi baştan oku (sakatlık durumları ve geçen sezon için)</label>
  <button id="sync">Senkronize et</button>
  <button id="cancel" class="secondary" hidden>Durdur</button>
  <button id="open" class="secondary">Uygulamayı aç</button>
  <div class="muted" style="margin-top:8px">Yalnızca eksik olan okunur: bitmiş haftalar ve kayıtlı günler atlanır, kadrolar 6 saatte bir yenilenir. Bu pencereyi kapatabilirsin; Yahoo sekmesini kapatma.</div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
